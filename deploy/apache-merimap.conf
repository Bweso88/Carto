# MeriMap — hôte virtuel Apache (Debian/Ubuntu)
# Copier dans /etc/apache2/sites-available/merimap.conf, adapter ServerName et les chemins, puis :
#   sudo a2enmod proxy_fcgi setenvif rewrite headers ssl
#   sudo a2enconf php8.3-fpm
#   sudo a2ensite merimap && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName merimap.intranet.local
    # Tout le trafic passe en HTTPS (nécessaire pour les passkeys et les cookies sécurisés)
    Redirect permanent / https://merimap.intranet.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName merimap.intranet.local

    # IMPORTANT : la racine web est le dossier public/, jamais la racine du projet
    DocumentRoot /var/www/merimap/current/public

    <Directory /var/www/merimap/current/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    SSLEngine on
    # Certificat délivré par votre autorité de certification interne
    SSLCertificateFile    /etc/ssl/merimap/merimap.crt
    SSLCertificateKeyFile /etc/ssl/merimap/merimap.key

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  ${APACHE_LOG_DIR}/merimap_error.log
    CustomLog ${APACHE_LOG_DIR}/merimap_access.log combined
</VirtualHost>
