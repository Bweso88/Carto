# MeriMap — configuration Nginx (alternative à Apache)
# Copier dans /etc/nginx/sites-available/merimap, adapter, puis :
#   sudo ln -s /etc/nginx/sites-available/merimap /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name merimap.intranet.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name merimap.intranet.local;

    # IMPORTANT : la racine web est le dossier public/
    root /var/www/merimap/current/public;
    index index.php;

    ssl_certificate     /etc/ssl/merimap/merimap.crt;
    ssl_certificate_key /etc/ssl/merimap/merimap.key;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fichiers compilés par Vite : mis en cache longtemps (noms versionnés)
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Aucun autre fichier PHP ni fichier caché n'est servi
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
