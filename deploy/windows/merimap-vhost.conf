# MeriMap — hôte virtuel pour WampServer
# À ajouter à la fin de C:\wamp64\bin\apache\apache2.4.x\conf\extra\httpd-vhosts.conf
# (ou via le menu WampServer > Vos VirtualHosts > Gestion VirtualHost), puis redémarrer les services.

<VirtualHost *:80>
    ServerName merimap.intranet.local
    # IMPORTANT : la racine web est le dossier public, jamais la racine du projet
    DocumentRoot "C:/merimap/public"

    <Directory "C:/merimap/public/">
        Options +FollowSymLinks -Indexes
        AllowOverride All
        # Accès depuis tout le réseau interne (WampServer n'autorise que localhost par défaut)
        Require all granted
    </Directory>

    ErrorLog "logs/merimap-error.log"
    CustomLog "logs/merimap-access.log" common
</VirtualHost>
